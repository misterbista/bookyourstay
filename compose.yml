name: bookyourstay

services:
  postgres:
    image: postgres:16-alpine
    container_name: bookyourstay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bookyourstay}
      POSTGRES_USER: ${POSTGRES_USER:-bookyourstay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookyourstay}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-bookyourstay} -d ${POSTGRES_DB:-bookyourstay}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
